[package]
name = "acw-sandbox"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "fs", "io-util", "net", "time", "sync", "rt", "macros"] }
tokio-util = "0.7.20"

[dev-dependencies]
tempfile = "3.27.0"
