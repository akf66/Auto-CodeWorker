[package]
name = "acw-llm"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time"] }
